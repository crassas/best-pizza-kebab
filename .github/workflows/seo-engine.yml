name: SEO Engine

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-aeo-geo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and audit
        run: node scripts/seo-engine.mjs all
